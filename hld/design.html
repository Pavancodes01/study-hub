<main id="app"><div class="page"><p class="head">Loading the board…</p></div></main>

<script>
HLD.bar('');
HLD.boot(function(){
  var list = HLD.byOrder(HLD.designs);
  var item = HLD.find(list, HLD.param('d')) || list[0];
  if (!item){ document.getElementById('app').innerHTML = '<div class="page"><p class="head">This page has no content yet. Go back to the <a href="index.html">board</a>.</p></div>'; return; }
  renderDesign(item, list);
});
</script>
