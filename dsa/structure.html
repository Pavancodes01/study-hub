<script>
DSA.topbar('ds');
DSA.boot('', DSA.dsFiles(''), function(){
  var all = DSA.sortedDS();
  var d = DSA.getDS(DSA.param('d')) || all[0];
  if (!d){ document.getElementById('app').innerHTML = '<p class="single">No structure data found.</p>'; return; }
  renderStructure(d, all);
});
