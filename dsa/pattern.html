<script>
DSA.topbar('home');
DSA.boot('', [], function(){
  var all = DSA.sorted();
  var p = DSA.get(DSA.param('p')) || all[0];
  if (!p){ document.getElementById('app').innerHTML = '<p class="single">No pattern data found.</p>'; return; }
  renderPattern(p, all);
});
</script>
